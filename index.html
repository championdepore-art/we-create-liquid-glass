 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200') center/cover;
    font-family:sans-serif;
    overflow:hidden;
  }
  .glass{
    width:320px;
    padding:30px;
    border-radius:30px;
    text-align:center;
    color:white;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.4);
    box-shadow:0 20px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .glass h1{font-size:28px;margin-bottom:10px}
  .glass p{font-size:14px;opacity:0.9;line-height:1.5}
  .glass button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:50px;
    background:rgba(255,255,255,0.9);
    font-weight:bold;
    cursor:pointer;
  }
</style>
</head>
<body>
  <div class="glass">
    <h1>Liquid Glass</h1>
    <p>Hii ni effect ya kioo kinachong'aa. Sogeza simu yako uone background ikibadilika nyuma yake.</p>
    <button>Click Me</button>
  </div>
</body>
</html>
